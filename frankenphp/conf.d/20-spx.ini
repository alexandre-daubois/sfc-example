; Profiling only starts when the app calls spx_profiler_start(), see ProfilerSubscriber.
spx.http_enabled = 1
spx.http_key = "workshop"
spx.http_ip_whitelist = "*"
spx.http_profiling_enabled = 1
spx.http_profiling_auto_start = 0
spx.http_profiling_builtins = 1
spx.http_profiling_metrics = "wt,zm"
spx.data_dir = /tmp/spx
